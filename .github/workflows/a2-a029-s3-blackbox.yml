name: A2 A029 S3 OwnedHome Black-box

on:
  pull_request:
    paths:
      - "tools/a2_owned_home_s3_blackbox_verify.py"
      - "tools/a2_owned_home_s3_browser_verify.mjs"
      - ".github/workflows/a2-a029-s3-blackbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out evaluation harness
        uses: actions/checkout@v4

      - name: Check out exact Companion-Mind candidate
        uses: actions/checkout@v4
        with:
          repository: aerenkolstein-code/Companion-Mind
          ref: 3b9b94cb37e23b761782fb1ae8d54345b931b3b1
          path: Companion-Mind

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and install exact candidate wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w /tmp/a2s3-wheels ./Companion-Mind
          python -m venv /tmp/a2s3-venv
          /tmp/a2s3-venv/bin/python -m pip install --no-index --no-deps /tmp/a2s3-wheels/companion_mind-*.whl

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C Companion-Mind rev-parse HEAD)" = "3b9b94cb37e23b761782fb1ae8d54345b931b3b1"
          test "$(git -C Companion-Mind rev-parse HEAD^{tree})" = "dff89b764eabcb8d1833256a9540edf88e19b536"

      - name: Run final A2-S3 TS3 black-box verification outside runtime checkout
        working-directory: /tmp
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(echo /tmp/a2s3-wheels/companion_mind-*.whl)
          python "$GITHUB_WORKSPACE/tools/a2_owned_home_s3_blackbox_verify.py" \
            --python /tmp/a2s3-venv/bin/python \
            --node node \
            --browser-verifier "$GITHUB_WORKSPACE/tools/a2_owned_home_s3_browser_verify.mjs" \
            --wheel "$WHEEL" \
            --candidate-sha 3b9b94cb37e23b761782fb1ae8d54345b931b3b1 \
            --candidate-tree dff89b764eabcb8d1833256a9540edf88e19b536 \
            --output /tmp/a2-a029-s3-blackbox-receipt.json

      - name: Upload exact-head A2-S3 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-a029-s3-blackbox-final
          path: /tmp/a2-a029-s3-blackbox-receipt.json
          if-no-files-found: error
