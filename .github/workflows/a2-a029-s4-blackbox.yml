name: A2 A029 S4 OwnedHome Black-box

on:
  pull_request:
    paths:
      - "tools/a2_owned_home_s4_blackbox_verify.py"
      - "tools/a2_owned_home_s4_browser_verify.mjs"
      - ".github/workflows/a2-a029-s4-blackbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out evaluation harness
        uses: actions/checkout@v4

      - name: Check out exact Companion-Mind candidate
        uses: actions/checkout@v4
        with:
          repository: aerenkolstein-code/Companion-Mind
          ref: 8975db16e5d5d3bab82b01eca4d20ad3f747faea
          path: Companion-Mind

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and install exact candidate wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w /tmp/a2s4-wheels ./Companion-Mind
          python -m venv /tmp/a2s4-venv
          /tmp/a2s4-venv/bin/python -m pip install --no-index --no-deps /tmp/a2s4-wheels/companion_mind-*.whl

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C Companion-Mind rev-parse HEAD)" = "8975db16e5d5d3bab82b01eca4d20ad3f747faea"
          test "$(git -C Companion-Mind rev-parse HEAD^{tree})" = "3a0b5b5120c15504db10f41e11a0dc5997a779ee"

      - name: Run final A2-S4 TS4 black-box verification outside runtime checkout
        working-directory: /tmp
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(echo /tmp/a2s4-wheels/companion_mind-*.whl)
          python "$GITHUB_WORKSPACE/tools/a2_owned_home_s4_blackbox_verify.py" \
            --python /tmp/a2s4-venv/bin/python \
            --node node \
            --browser-verifier "$GITHUB_WORKSPACE/tools/a2_owned_home_s4_browser_verify.mjs" \
            --wheel "$WHEEL" \
            --candidate-sha 8975db16e5d5d3bab82b01eca4d20ad3f747faea \
            --candidate-tree 3a0b5b5120c15504db10f41e11a0dc5997a779ee \
            --output /tmp/a2-a029-s4-blackbox-receipt.json

      - name: Upload exact-head A2-S4 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-a029-s4-blackbox-final
          path: /tmp/a2-a029-s4-blackbox-receipt.json
          if-no-files-found: error
