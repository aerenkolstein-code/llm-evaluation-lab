name: B2 Blind Run Ephemeral Q1 R1

on:
  push:
    branches: [agent/b2-blind-run-q1-20260904-r1]
    paths: [.github/workflows/b2_blind_run_ephemeral.yml]

permissions:
  contents: read

jobs:
  blind-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_CONTEXT_SHA256: a595fb210b225e201e6b9a191a2559880ebd118946f770b440e5326955d58e58
      EXPECTED_PROMPT_SHA256: c27eeeab07789ed2ac49c3c5a6034093659c35cdf8b76b1c78b2b670872c5d4c
      EXPECTED_CONTEXT_BYTES: '108230'
      EXPECTED_PROMPT_BYTES: '2308'
      B2_MAIN_COMMIT: 901ba05b99c413d45415c474c71b5969c155dea1
      RUN_ID: B2-DITING-Q1-R1-DEEPSEEK-V4-PRO-20260904
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install bridge and crypto
        run: python -m pip install -e . cryptography
      - name: Generate ephemeral input key
        run: |
          mkdir -p /tmp/b2
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/b2/input_private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/b2/input_private.pem -out /tmp/b2/input_public.pem >/dev/null 2>&1
          chmod 600 /tmp/b2/input_private.pem
      - name: Publish input public key
        uses: actions/upload-artifact@v4
        with:
          name: b2-blind-q1-r1-input-public-key-v4
          path: /tmp/b2/input_public.pem
          retention-days: 1
      - name: Wait for encrypted payload pointer
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pointer_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/blind-input-v4/pointer.json?ref=${GITHUB_REF_NAME}"
          for _ in $(seq 1 240); do
            if curl -fsSL -H "Authorization: Bearer ${GH_READ_TOKEN}" -H "Accept: application/vnd.github.raw+json" "$pointer_api" -o /tmp/b2/pointer.json; then break; fi
            sleep 5
          done
          test -s /tmp/b2/pointer.json
          python - <<'PY'
          import json, pathlib, subprocess, hashlib
          p=json.loads(pathlib.Path('/tmp/b2/pointer.json').read_text())
          url=p['payload_url']; expected=p['payload_sha256']
          subprocess.run(['curl','-fL','--retry','0','--max-time','120',url,'-o','/tmp/b2/payload.json'],check=True)
          b=pathlib.Path('/tmp/b2/payload.json').read_bytes()
          if hashlib.sha256(b).hexdigest()!=expected: raise SystemExit('payload sha mismatch')
          PY
      - name: Decrypt and verify inputs
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,pathlib,zipfile
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          p=json.loads(pathlib.Path('/tmp/b2/payload.json').read_text())
          priv=serialization.load_pem_private_key(pathlib.Path('/tmp/b2/input_private.pem').read_bytes(),password=None)
          key=priv.decrypt(base64.b64decode(p['wrapped_key_b64']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          archive=AESGCM(key).decrypt(base64.b64decode(p['nonce_b64']),base64.b64decode(p['ciphertext_b64']),b'B2-DITING-Q1-R1')
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            c=z.read('context.txt'); q=z.read('prompt.txt')
          if hashlib.sha256(c).hexdigest()!=os.environ['EXPECTED_CONTEXT_SHA256'] or len(c)!=int(os.environ['EXPECTED_CONTEXT_BYTES']): raise SystemExit('context mismatch')
          if hashlib.sha256(q).hexdigest()!=os.environ['EXPECTED_PROMPT_SHA256'] or len(q)!=int(os.environ['EXPECTED_PROMPT_BYTES']): raise SystemExit('prompt mismatch')
          pathlib.Path('/tmp/b2/context.txt').write_bytes(c); pathlib.Path('/tmp/b2/prompt.txt').write_bytes(q)
          PY
      - name: Execute exactly one authorized blind provider attempt
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m b2.blind_eval --context-file /tmp/b2/context.txt --prompt-file /tmp/b2/prompt.txt --provider deepseek --protocol openai-compatible-chat-completions/v1 --model deepseek-v4-pro --endpoint https://api.deepseek.com/chat/completions --api-key-env DEEPSEEK_API_KEY --run-id "$RUN_ID" --git-commit "$B2_MAIN_COMMIT" --timeout 180 --temperature 0 --max-tokens 8192 --raw-output /tmp/b2/raw.txt --receipt-output /tmp/b2/receipt.json --authorize-live-call > /tmp/b2/stdout.json
          code=$?; set -e; echo "$code" > /tmp/b2/exit.txt; test -f /tmp/b2/receipt.json
      - name: Encrypt result bundle
        run: |
          python - <<'PY'
          import base64,io,json,os,pathlib,secrets,zipfile
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          bio=io.BytesIO()
          with zipfile.ZipFile(bio,'w',zipfile.ZIP_DEFLATED) as z:
            for f,a in [('receipt.json','receipt.json'),('stdout.json','bridge_stdout.json'),('exit.txt','bridge_exit_code.txt'),('raw.txt','raw_answer.txt')]:
              p=pathlib.Path('/tmp/b2')/f
              if p.exists(): z.writestr(a,p.read_bytes())
            z.writestr('run_meta.json',json.dumps({'run_id':os.environ['RUN_ID'],'main_commit':os.environ['B2_MAIN_COMMIT'],'requested_model':'deepseek-v4-pro','provider':'deepseek'},sort_keys=True).encode())
          pub=serialization.load_pem_public_key(pathlib.Path('blind-handshake/return_public.pem').read_bytes())
          key=secrets.token_bytes(32); nonce=secrets.token_bytes(12)
          ct=AESGCM(key).encrypt(nonce,bio.getvalue(),b'B2-DITING-Q1-R1-RESULT')
          wk=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          pathlib.Path('/tmp/b2/result.enc.json').write_text(json.dumps({'alg':'RSA-OAEP-SHA256+AES-256-GCM/v1','wrapped_key_b64':base64.b64encode(wk).decode(),'nonce_b64':base64.b64encode(nonce).decode(),'ciphertext_b64':base64.b64encode(ct).decode()},separators=(',',':')))
          PY
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: b2-blind-q1-r1-encrypted-result-v4
          path: /tmp/b2/result.enc.json
          retention-days: 1
      - name: Cleanup plaintext
        if: always()
        run: rm -f /tmp/b2/context.txt /tmp/b2/prompt.txt /tmp/b2/raw.txt /tmp/b2/receipt.json /tmp/b2/stdout.json /tmp/b2/input_private.pem /tmp/b2/payload.json
