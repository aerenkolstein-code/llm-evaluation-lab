name: B2 BM1 Window-Controlled Live

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: b2-bm1-live-issue-50
  cancel-in-progress: false

jobs:
  public-gate:
    name: Public-safe exact live-approval gate
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 50 &&
      github.event.issue.pull_request == null &&
      github.actor == 'aerenkolstein-code' &&
      github.event.comment.user.login == 'aerenkolstein-code' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    environment: b2-bm1-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner_os: ${{ steps.gate.outputs.runner_os }}
      comment_id: ${{ steps.gate.outputs.comment_id }}
      comment_fingerprint: ${{ steps.gate.outputs.comment_fingerprint }}
      execution_head_sha: ${{ steps.gate.outputs.execution_head_sha }}
      execution_tree_sha: ${{ steps.gate.outputs.execution_tree_sha }}
      workflow_run_id: ${{ steps.gate.outputs.workflow_run_id }}
      authorization_id: ${{ steps.gate.outputs.authorization_id }}
      run_ready_receipt_fingerprint: ${{ steps.gate.outputs.run_ready_receipt_fingerprint }}
    env:
      B2_BM1_EXPECTED_RUN_READY_RECEIPT_FINGERPRINT: ${{ vars.B2_BM1_RUN_READY_RECEIPT_FINGERPRINT }}
    steps:
      - name: Check out the exact default-branch head
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - id: gate
        name: Validate exact canonical live-approval comment
        env:
          B2_BM1_RUNNER_OS: ${{ vars.B2_BM1_RUNNER_OS }}
        run: python -m b2.bm1_live gate-live --repo-root .

  private-live:
    name: Private exact-four-attempt live lane
    needs: public-gate
    if: needs.public-gate.result == 'success' && github.run_attempt == 1 && needs.public-gate.outputs.runner_os == 'linux'
    environment: b2-bm1-live
    runs-on:
      - self-hosted
      - linux
      - x64
      - b2-bm1-private
    timeout-minutes: 30
    defaults:
      run:
        shell: python {0}
    env:
      B2_BM1_RUNNER_OS: ${{ vars.B2_BM1_RUNNER_OS }}
      B2_BM1_GUARDED_RUNNER_OS: ${{ needs.public-gate.outputs.runner_os }}
      B2_BM1_LANE_OS: linux
    steps:
      - name: Check out the exact gated main head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.public-gate.outputs.execution_head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert native OS and architecture before private inputs
        run: |
          import os
          from b2.bm1_live import assert_private_runner
          assert_private_runner(os.environ)

      - id: execute
        name: Execute through the sealed BM1Runner transaction
        env:
          B2_BM1_EXPECTED_RUN_READY_RECEIPT_FINGERPRINT: ${{ needs.public-gate.outputs.run_ready_receipt_fingerprint }}
          B2_BM1_GUARDED_COMMENT_ID: ${{ needs.public-gate.outputs.comment_id }}
          B2_BM1_GUARDED_COMMENT_FINGERPRINT: ${{ needs.public-gate.outputs.comment_fingerprint }}
          B2_BM1_GUARDED_EXECUTION_HEAD_SHA: ${{ needs.public-gate.outputs.execution_head_sha }}
          B2_BM1_GUARDED_EXECUTION_TREE_SHA: ${{ needs.public-gate.outputs.execution_tree_sha }}
          B2_BM1_GUARDED_WORKFLOW_RUN_ID: ${{ needs.public-gate.outputs.workflow_run_id }}
          B2_BM1_PROVIDER_AUTHORITY_FINGERPRINT: ${{ vars.B2_BM1_PROVIDER_AUTHORITY_FINGERPRINT }}
          B2_BM1_PROVIDER_REVIEWED_AT: ${{ vars.B2_BM1_PROVIDER_REVIEWED_AT }}
          B2_BM1_GEMINI_KEY_AUTH_STATUS: ${{ vars.B2_BM1_GEMINI_KEY_AUTH_STATUS }}
          B2_BM1_GEMINI_KEY_AUTH_ATTESTATION_FINGERPRINT: ${{ vars.B2_BM1_GEMINI_KEY_AUTH_ATTESTATION_FINGERPRINT }}
          B2_BM1_GEMINI_KEY_AUTH_BINDING_HMAC_KEY: ${{ secrets.B2_BM1_GEMINI_KEY_AUTH_BINDING_HMAC_KEY }}
          B2_BM1_GEMINI_KEY_AUTH_IDENTITY_HMAC: ${{ secrets.B2_BM1_GEMINI_KEY_AUTH_IDENTITY_HMAC }}
          B2_BM1_RAW_BUNDLE_ID: ${{ vars.B2_BM1_RAW_BUNDLE_ID }}
          B2_BM1_ATTEMPT_CLAIM_STORE_ID: ${{ vars.B2_BM1_ATTEMPT_CLAIM_STORE_ID }}
          B2_BM1_RAW_BUNDLE_DIR: ${{ secrets.B2_BM1_RAW_BUNDLE_DIR }}
          B2_BM1_ATTEMPT_CLAIM_DIR: ${{ secrets.B2_BM1_ATTEMPT_CLAIM_DIR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PUBLIC_RESULT_FILE: ${{ runner.temp }}/bm1-live-public.json
        run: |
          import os
          from b2.bm1_live import main
          raise SystemExit(main(["execute-live", "--repo-root", ".",
                                 "--public-copy", os.environ["PUBLIC_RESULT_FILE"]]))

      - name: Publish body-free live receipts
        env:
          PUBLIC_RESULT_FILE: ${{ runner.temp }}/bm1-live-public.json
        run: |
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["PUBLIC_RESULT_FILE"]).read_text(encoding="ascii"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## BM1 window-controlled live result\n\n")
              handle.write(f"- Control Issue: `#50`\n")
              handle.write(f"- RUN-READY: `{result['run_ready_receipt_fingerprint']}`\n")
              handle.write(f"- Live authorization: `{result['live_authorization_fingerprint']}`\n")
              handle.write(f"- Provider attempts: `{result['provider_requests']}` / `4`\n")
              handle.write(f"- Global stop: `{result['global_stop_reason']}`\n\n")
              handle.write("| Attempt | Terminal | Reason | Receipt |\n|---|---|---|---|\n")
              for row in result["attempts"]:
                  handle.write(
                      f"| `{row['attempt_id']}` | `{row['terminal_status']}` | "
                      f"`{row['reason']}` | `{row['receipt_fingerprint']}` |\n"
                  )

  private-live-windows:
    name: Private exact-four-attempt live lane
    needs: public-gate
    if: needs.public-gate.result == 'success' && github.run_attempt == 1 && needs.public-gate.outputs.runner_os == 'windows'
    environment: b2-bm1-live
    runs-on:
      - self-hosted
      - windows
      - x64
      - b2-bm1-private
    timeout-minutes: 30
    defaults:
      run:
        shell: python {0}
    env:
      B2_BM1_RUNNER_OS: ${{ vars.B2_BM1_RUNNER_OS }}
      B2_BM1_GUARDED_RUNNER_OS: ${{ needs.public-gate.outputs.runner_os }}
      B2_BM1_LANE_OS: windows
    steps:
      - name: Check out the exact gated main head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.public-gate.outputs.execution_head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert native OS and architecture before private inputs
        run: |
          import os
          from b2.bm1_live import assert_private_runner
          assert_private_runner(os.environ)

      - id: execute
        name: Execute through the sealed BM1Runner transaction
        env:
          B2_BM1_EXPECTED_RUN_READY_RECEIPT_FINGERPRINT: ${{ needs.public-gate.outputs.run_ready_receipt_fingerprint }}
          B2_BM1_GUARDED_COMMENT_ID: ${{ needs.public-gate.outputs.comment_id }}
          B2_BM1_GUARDED_COMMENT_FINGERPRINT: ${{ needs.public-gate.outputs.comment_fingerprint }}
          B2_BM1_GUARDED_EXECUTION_HEAD_SHA: ${{ needs.public-gate.outputs.execution_head_sha }}
          B2_BM1_GUARDED_EXECUTION_TREE_SHA: ${{ needs.public-gate.outputs.execution_tree_sha }}
          B2_BM1_GUARDED_WORKFLOW_RUN_ID: ${{ needs.public-gate.outputs.workflow_run_id }}
          B2_BM1_PROVIDER_AUTHORITY_FINGERPRINT: ${{ vars.B2_BM1_PROVIDER_AUTHORITY_FINGERPRINT }}
          B2_BM1_PROVIDER_REVIEWED_AT: ${{ vars.B2_BM1_PROVIDER_REVIEWED_AT }}
          B2_BM1_GEMINI_KEY_AUTH_STATUS: ${{ vars.B2_BM1_GEMINI_KEY_AUTH_STATUS }}
          B2_BM1_GEMINI_KEY_AUTH_ATTESTATION_FINGERPRINT: ${{ vars.B2_BM1_GEMINI_KEY_AUTH_ATTESTATION_FINGERPRINT }}
          B2_BM1_GEMINI_KEY_AUTH_BINDING_HMAC_KEY: ${{ secrets.B2_BM1_GEMINI_KEY_AUTH_BINDING_HMAC_KEY }}
          B2_BM1_GEMINI_KEY_AUTH_IDENTITY_HMAC: ${{ secrets.B2_BM1_GEMINI_KEY_AUTH_IDENTITY_HMAC }}
          B2_BM1_RAW_BUNDLE_ID: ${{ vars.B2_BM1_RAW_BUNDLE_ID }}
          B2_BM1_ATTEMPT_CLAIM_STORE_ID: ${{ vars.B2_BM1_ATTEMPT_CLAIM_STORE_ID }}
          B2_BM1_RAW_BUNDLE_DIR: ${{ secrets.B2_BM1_RAW_BUNDLE_DIR }}
          B2_BM1_ATTEMPT_CLAIM_DIR: ${{ secrets.B2_BM1_ATTEMPT_CLAIM_DIR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PUBLIC_RESULT_FILE: ${{ runner.temp }}/bm1-live-public.json
        run: |
          import os
          from b2.bm1_live import main
          raise SystemExit(main(["execute-live", "--repo-root", ".",
                                 "--public-copy", os.environ["PUBLIC_RESULT_FILE"]]))

      - name: Publish body-free live receipts
        env:
          PUBLIC_RESULT_FILE: ${{ runner.temp }}/bm1-live-public.json
        run: |
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["PUBLIC_RESULT_FILE"]).read_text(encoding="ascii"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## BM1 window-controlled live result\n\n")
              handle.write(f"- Control Issue: `#50`\n")
              handle.write(f"- RUN-READY: `{result['run_ready_receipt_fingerprint']}`\n")
              handle.write(f"- Live authorization: `{result['live_authorization_fingerprint']}`\n")
              handle.write(f"- Provider attempts: `{result['provider_requests']}` / `4`\n")
              handle.write(f"- Global stop: `{result['global_stop_reason']}`\n\n")
              handle.write("| Attempt | Terminal | Reason | Receipt |\n|---|---|---|---|\n")
              for row in result["attempts"]:
                  handle.write(
                      f"| `{row['attempt_id']}` | `{row['terminal_status']}` | "
                      f"`{row['reason']}` | `{row['receipt_fingerprint']}` |\n"
                  )
