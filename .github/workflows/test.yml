name: Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVAL_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out evaluation repository
        uses: actions/checkout@v4
        with:
          path: llm-evaluation-lab

      - name: Check out Companion-Mind
        uses: actions/checkout@v4
        with:
          repository: aerenkolstein-code/Companion-Mind
          ref: c6a2128271532746a5570b99ce0ccdea4618db4e
          path: Companion-Mind

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Companion-Mind/pyproject.toml
            llm-evaluation-lab/pyproject.toml

      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e Companion-Mind
          python -m pip install -e llm-evaluation-lab

      - name: Run evaluation tests
        working-directory: llm-evaluation-lab
        run: python -m unittest discover -s tests -v

      - name: Run SEARCH-CUP-02 P0 regression and P1 offline gates
        working-directory: llm-evaluation-lab
        run: |
          llm-search-cup preflight > /tmp/search-cup-preflight.json
          llm-search-cup demo --format json --output /tmp/search-cup-offline.json
          python - <<'PY'
          import json

          preflight = json.load(open('/tmp/search-cup-preflight.json', encoding='utf-8'))
          report = json.load(open('/tmp/search-cup-offline.json', encoding='utf-8'))
          assert preflight['mode'] == 'OFFLINE_ONLY'
          assert preflight['official_match_authorized'] is False
          assert preflight['live_provider_adapters'] == 0
          assert preflight['search_pro_backend_available'] is True
          assert preflight['live_search_requires_explicit_smoke_authorization'] is True
          assert preflight['entrant_count'] == 4
          assert len(report['scores']) == 4
          assert all(score['exact_model_id'].startswith('fake-') for score in report['scores'])
          PY

      - name: Run checked experiment
        working-directory: llm-evaluation-lab
        run: |
          llm-eval \
            --cases cases/anonymized/premature-parent-closure.md \
            --format json \
            --emit-mitigation /tmp/MIT-CLOSURE-GUARD-001.json \
            --output /tmp/EVAL-CASE-001.json
          llm-eval \
            --cases cases/anonymized/premature-parent-closure.md \
            --format markdown \
            --output /tmp/EVAL-CASE-001.md
          test -s /tmp/EVAL-CASE-001.json
          test -s /tmp/EVAL-CASE-001.md
          test -s /tmp/MIT-CLOSURE-GUARD-001.json
          companion-mind validate-mitigation \
            --mitigation-spec /tmp/MIT-CLOSURE-GUARD-001.json \
            > /tmp/MIT-CLOSURE-GUARD-001.validated.json
          test -s /tmp/MIT-CLOSURE-GUARD-001.validated.json

      - name: Run historical failure benchmark
        working-directory: llm-evaluation-lab
        run: |
          llm-eval \
            --suite historical \
            --cases cases/anonymized/premature-parent-closure.md \
            --format json \
            --store /tmp/eval-runs.sqlite3 \
            --run-id "CI-HFB-${EVAL_GIT_COMMIT}" \
            --model deterministic-reference \
            --prompt-version hfb-v1 \
            --git-commit "$EVAL_GIT_COMMIT" \
            --log-json \
            --output /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.json
          llm-eval \
            --suite historical \
            --cases cases/anonymized/premature-parent-closure.md \
            --format markdown \
            --output /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.md
          test -s /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.json
          test -s /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.md
          test -s /tmp/eval-runs.sqlite3
          llm-eval \
            --store /tmp/eval-runs.sqlite3 \
            --list-runs 1 \
            --output /tmp/experiment-runs.json
          python -c 'import json; rows=json.load(open("/tmp/experiment-runs.json")); assert len(rows)==1; assert rows[0]["regression_status"]=="PASS"; assert rows[0]["git_commit"]'

      - name: Smoke-test read-only query API
        working-directory: llm-evaluation-lab
        run: |
          llm-eval-api \
            --store /tmp/eval-runs.sqlite3 \
            --host 127.0.0.1 \
            --port 8765 \
            --log-level warning \
            > /tmp/llm-eval-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail \
            --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8765/healthz \
            > /tmp/api-health.json
          curl --silent --show-error --fail \
            'http://127.0.0.1:8765/v1/runs?limit=1' \
            > /tmp/api-runs.json
          python - <<'PY'
          import json

          health = json.load(open('/tmp/api-health.json', encoding='utf-8'))
          runs = json.load(open('/tmp/api-runs.json', encoding='utf-8'))
          assert health == {
              'status': 'ok',
              'service': 'llm-evaluation-lab',
              'read_only': True,
              'store_schema_version': 1,
          }
          assert len(runs) == 1
          assert runs[0]['regression_status'] == 'PASS'
          PY

      - name: Build and smoke-test Docker image
        run: |
          docker build \
            --tag llm-evaluation-lab:ci \
            --build-arg COMPANION_MIND_COMMIT=c6a2128271532746a5570b99ce0ccdea4618db4e \
            llm-evaluation-lab

          docker run --rm llm-evaluation-lab:ci --version \
            > /tmp/docker-version.txt
          grep --quiet '^llm-eval 0.9.0$' /tmp/docker-version.txt

          docker run --rm \
            --entrypoint llm-search-cup \
            llm-evaluation-lab:ci \
            preflight \
            > /tmp/docker-search-cup-preflight.json
          python -c 'import json; result=json.load(open("/tmp/docker-search-cup-preflight.json")); assert result["mode"]=="OFFLINE_ONLY"; assert result["official_match_authorized"] is False'

          docker run --rm llm-evaluation-lab:ci \
            --suite historical \
            --cases cases/anonymized/premature-parent-closure.md \
            > /tmp/docker-historical.json
          python -c 'import json; result=json.load(open("/tmp/docker-historical.json")); assert result["regression"]["status"]=="PASS"; assert result["fixture_count"]==24'

          mkdir -p /tmp/llm-eval-docker-data
          chmod 0777 /tmp/llm-eval-docker-data
          docker run --rm \
            --volume /tmp/llm-eval-docker-data:/data \
            llm-evaluation-lab:ci \
            --suite historical \
            --cases cases/anonymized/premature-parent-closure.md \
            --store /data/eval-runs.sqlite3 \
            --run-id CONTAINER-HFB-001 \
            --git-commit "$EVAL_GIT_COMMIT" \
            --output /data/container-run.json

          trap 'docker rm --force llm-eval-api-ci 2>/dev/null || true' EXIT
          docker run --rm --detach \
            --name llm-eval-api-ci \
            --publish 127.0.0.1:8766:8000 \
            --volume /tmp/llm-eval-docker-data:/data:ro \
            --entrypoint llm-eval-api \
            llm-evaluation-lab:ci \
            --store /data/eval-runs.sqlite3 \
            --host 0.0.0.0 \
            --allow-network \
            --port 8000 \
            --log-level warning
          API_READY=false
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --fail \
              http://127.0.0.1:8766/healthz \
              > /tmp/docker-api-health.json; then
              API_READY=true
              break
            fi
            sleep 1
          done
          if [ "$API_READY" != true ]; then
            docker logs llm-eval-api-ci
            exit 1
          fi
          curl --silent --show-error --fail \
            'http://127.0.0.1:8766/v1/runs?limit=1' \
            > /tmp/docker-api-runs.json
          python -c 'import json; health=json.load(open("/tmp/docker-api-health.json")); runs=json.load(open("/tmp/docker-api-runs.json")); assert health["read_only"] is True; assert runs[0]["run_id"]=="CONTAINER-HFB-001"'
