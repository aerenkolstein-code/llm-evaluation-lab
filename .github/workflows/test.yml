name: Test

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVAL_GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out evaluation repository
        uses: actions/checkout@v4
        with:
          path: llm-evaluation-lab

      - name: Check out Companion-Mind
        uses: actions/checkout@v4
        with:
          repository: aerenkolstein-code/Companion-Mind
          ref: c6a2128271532746a5570b99ce0ccdea4618db4e
          path: Companion-Mind

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Companion-Mind/pyproject.toml
            llm-evaluation-lab/pyproject.toml

      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e Companion-Mind
          python -m pip install -e llm-evaluation-lab

      - name: Run evaluation tests
        working-directory: llm-evaluation-lab
        run: python -m unittest discover -s tests -v

      - name: Run checked experiment
        working-directory: llm-evaluation-lab
        run: |
          llm-eval \
            --cases cases/anonymized/premature-parent-closure.md \
            --format json \
            --emit-mitigation /tmp/MIT-CLOSURE-GUARD-001.json \
            --output /tmp/EVAL-CASE-001.json
          llm-eval \
            --cases cases/anonymized/premature-parent-closure.md \
            --format markdown \
            --output /tmp/EVAL-CASE-001.md
          test -s /tmp/EVAL-CASE-001.json
          test -s /tmp/EVAL-CASE-001.md
          test -s /tmp/MIT-CLOSURE-GUARD-001.json
          companion-mind validate-mitigation \
            --mitigation-spec /tmp/MIT-CLOSURE-GUARD-001.json \
            > /tmp/MIT-CLOSURE-GUARD-001.validated.json
          test -s /tmp/MIT-CLOSURE-GUARD-001.validated.json

      - name: Run historical failure benchmark
        working-directory: llm-evaluation-lab
        run: |
          llm-eval \
            --suite historical \
            --cases cases/anonymized/premature-parent-closure.md \
            --format json \
            --store /tmp/eval-runs.sqlite3 \
            --run-id "CI-HFB-${EVAL_GIT_COMMIT}" \
            --model deterministic-reference \
            --prompt-version hfb-v1 \
            --git-commit "$EVAL_GIT_COMMIT" \
            --log-json \
            --output /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.json
          llm-eval \
            --suite historical \
            --cases cases/anonymized/premature-parent-closure.md \
            --format markdown \
            --output /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.md
          test -s /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.json
          test -s /tmp/HISTORICAL-FAILURE-BENCHMARK-v1.md
          test -s /tmp/eval-runs.sqlite3
          llm-eval \
            --store /tmp/eval-runs.sqlite3 \
            --list-runs 1 \
            --output /tmp/experiment-runs.json
          python -c 'import json; rows=json.load(open("/tmp/experiment-runs.json")); assert len(rows)==1; assert rows[0]["regression_status"]=="PASS"; assert rows[0]["git_commit"]'

      - name: Smoke-test read-only query API
        working-directory: llm-evaluation-lab
        run: |
          llm-eval-api \
            --store /tmp/eval-runs.sqlite3 \
            --host 127.0.0.1 \
            --port 8765 \
            --log-level warning \
            > /tmp/llm-eval-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail \
            --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8765/healthz \
            > /tmp/api-health.json
          curl --silent --show-error --fail \
            'http://127.0.0.1:8765/v1/runs?limit=1' \
            > /tmp/api-runs.json
          python - <<'PY'
          import json

          health = json.load(open('/tmp/api-health.json', encoding='utf-8'))
          runs = json.load(open('/tmp/api-runs.json', encoding='utf-8'))
          assert health == {
              'status': 'ok',
              'service': 'llm-evaluation-lab',
              'read_only': True,
              'store_schema_version': 1,
          }
          assert len(runs) == 1
          assert runs[0]['regression_status'] == 'PASS'
          PY
