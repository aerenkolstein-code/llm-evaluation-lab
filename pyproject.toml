[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-lab"
version = "0.10.0"
description = "Reproducible LLM evaluation harness with a gated provider-neutral search benchmark"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
llm-eval = "evaluation_lab:main"
llm-eval-api = "evaluation_lab:serve_main"
llm-search-cup = "search_cup.cli:main"

[tool.setuptools]
py-modules = ["evaluation_lab"]
packages = ["search_cup"]

[tool.setuptools.data-files]
"candidates" = ["candidates/*.json"]
"competitions" = ["competitions/*.json"]
